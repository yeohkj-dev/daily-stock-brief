name: 观察清单简报

# 盘前版：美东约 07:15–09:15；收盘版：美东约 16:45–17:45。
# GitHub 排程常晚 10–60 分钟，夏令时 / 冬令时也不同，所以每版排两次；
# 程序按美东时间判断版本，同一天同一版只出一次，周末和休市日自动跳过。
on:
  schedule:
    - cron: "15 12,13 * * 1-5"   # 盘前版
    - cron: "45 20,21 * * 1-5"   # 收盘版
  workflow_dispatch:
    inputs:
      mode:
        description: "版本（留空 = 按美东时间自动判断）"
        required: false
        type: choice
        options: ["", "premarket", "close"]

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 永远用最新的 main（Re-run 时 GitHub 默认用旧版本，推送会被拒绝）
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成简报
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--force"
            if [ -n "${{ inputs.mode }}" ]; then ARGS="$ARGS --mode ${{ inputs.mode }}"; fi
          fi
          python tools/stock_brief.py $ARGS

      # 发到 Telegram（只在报告成功生成后；同一份只发一次；发送失败不影响网站）
      - name: 发送到 Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/telegram_send.py

      - name: 保存结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A docs telegram
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -q -m "简报 $(TZ=America/New_York date +%Y-%m-%d\ %H:%M) ET"
            # 推送前先同步；期间有别的更新时，冲突的文件以这次新生成的为准；最多试 3 次
            for i in 1 2 3; do
              git pull -q --rebase -X theirs origin main && git push -q && exit 0
              echo "推送失败，第 $i 次重试"; sleep 5
            done
            exit 1
          fi
